<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>PVP Session</title>

  <style>
    body {
      margin: 0;
      background: transparent;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    .overlay {
      width: 620px;
      padding: 24px 30px;
      background: radial-gradient(circle at top, #1a0000, #050000 75%);
      border: 3px solid #ff2a2a;
      border-radius: 20px;
      box-shadow:
        0 0 28px rgba(255, 0, 0, 0.6),
        inset 0 0 26px rgba(255, 0, 0, 0.25);
      color: white;
      animation: pulse 2.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 22px rgba(255,0,0,0.45), inset 0 0 22px rgba(255,0,0,0.25); }
      50% { box-shadow: 0 0 46px rgba(255,0,0,0.9), inset 0 0 36px rgba(255,0,0,0.4); }
      100% { box-shadow: 0 0 22px rgba(255,0,0,0.45), inset 0 0 22px rgba(255,0,0,0.25); }
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .title {
      font-size: 30px;
      font-weight: 900;
      color: #ff3b3b;
      letter-spacing: 1.5px;
      text-shadow:
        0 0 8px #ff0000,
        0 0 18px #aa0000;
    }

    .credit {
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.5px;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 26px;
    }

    .stat {
      flex: 1;
      text-align: center;
    }

    .label {
      display: block;
      font-size: 16px;
      font-weight: 700;
      color: #ffb3b3;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .value {
      font-size: 38px;
      font-weight: 900;
      text-shadow: 0 0 12px rgba(255,0,0,0.7);
    }

    .profit-positive {
      color: #00ff88;
      text-shadow: 0 0 16px rgba(0,255,136,0.9);
    }

    .profit-negative {
      color: #ff4444;
      text-shadow: 0 0 16px rgba(255,68,68,0.95);
    }

    .shake {
      animation: shake 0.35s;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
      75% { transform: translateX(-4px); }
      100% { transform: translateX(0); }
    }
  </style>
</head>
<body>

  <div class="overlay" id="overlay">
    <div class="header">
      <div class="title">⚔️ ALBION PVP ⚔️</div>
      <div class="credit">By Bloodyphantom</div>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="label">Asesinatos</span>
        <span class="value" id="kills">0</span>
      </div>

      <div class="stat">
        <span class="label">Muertes</span>
        <span class="value" id="deaths">0</span>
      </div>

      <div class="stat">
        <span class="label">Profit</span>
        <span class="value" id="profit">0</span>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const session = params.get("session") || "1";

    let lastKills = 0;
    let lastDeaths = 0;

    async function updateStats() {
      try {
        const res = await fetch(`/stats?session=${session}`);
        const data = await res.json();

        const overlay = document.getElementById("overlay");

        if (data.kills > lastKills || data.deaths > lastDeaths) {
          overlay.classList.add("shake");
          setTimeout(() => overlay.classList.remove("shake"), 400);
        }

        document.getElementById("kills").textContent = data.kills;
        document.getElementById("deaths").textContent = data.deaths;

        const profitEl = document.getElementById("profit");
        profitEl.textContent = data.profit.toLocaleString() + " silver";
        profitEl.className =
          "value " + (data.profit >= 0 ? "profit-positive" : "profit-negative");

        lastKills = data.kills;
        lastDeaths = data.deaths;
      } catch (e) {
        console.error("Error cargando stats", e);
      }
    }

    updateStats();
    setInterval(updateStats, 15000);
  </script>

</body>
</html>
