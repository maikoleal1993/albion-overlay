<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Albion PvP Overlay</title>

  <style>
    body {
      margin: 0;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    .overlay {
      width: 360px;
      padding: 20px;
      background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
      border: 3px solid #b30000;
      border-radius: 14px;
      box-shadow: 0 0 30px rgba(179, 0, 0, 0.6);
      color: white;
    }

    .title {
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 14px;
      color: #ff4444;
      text-shadow: 0 0 8px #ff0000;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      margin: 8px 0;
    }

    .label {
      color: #aaa;
    }

    .value {
      font-weight: bold;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="overlay">
    <div class="title">⚔️ Albion PvP Session</div>

    <div class="stat">
      <span class="label">Kills</span>
      <span class="value" id="kills">0</span>
    </div>

    <div class="stat">
      <span class="label">Deaths</span>
      <span class="value" id="deaths">0</span>
    </div>

    <div class="stat">
      <span class="label">Profit</span>
      <span class="value" id="profit">0</span>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const session = params.get("session") || "1";

    async function updateStats() {
      try {
        const res = await fetch(`/stats?session=${session}`);
        const data = await res.json();

        document.getElementById("kills").textContent = data.kills;
        document.getElementById("deaths").textContent = data.deaths;
        document.getElementById("profit").textContent =
          data.profit.toLocaleString() + " silver";
      } catch (e) {
        console.error("Error cargando stats", e);
      }
    }

    updateStats();
    setInterval(updateStats, 15000);
  </script>

</body>
</html>
