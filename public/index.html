<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Albion PvP Overlay</title>
  <style>
    body {
      margin: 0;
      background: transparent;
      color: white;
      font-family: Arial, sans-serif;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.6);
      padding: 15px 25px;
      border-radius: 10px;
      display: inline-flex;
      gap: 25px;
      font-size: 22px;
    }
  </style>
</head>
<body>
  <div class="overlay">
    ⚔️ Kills: <span id="kills">0</span>
    💀 Deaths: <span id="deaths">0</span>
    💰 Profit: <span id="profit">0</span> silver
  </div>

  <script>
    // datos falsos por ahora (luego los conectamos)
    let kills = 0;
    let deaths = 0;
    let profit = 0;

    setInterval(() => {
      kills++;
      profit += 120000;
      document.getElementById("kills").innerText = kills;
      document.getElementById("profit").innerText = profit;
    }, 5000);
  </script>
</body>
</html>
