<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Albion PvP Overlay</title>
  <style>
    body {
      margin: 0;
      background: transparent;
      color: white;
      font-family: Arial, sans-serif;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.65);
      padding: 15px 25px;
      border-radius: 12px;
      display: inline-flex;
      gap: 25px;
      font-size: 22px;
    }
  </style>
</head>
<body>
  <div class="overlay">
    ⚔️ Kills: <span id="kills">0</span>
    💀 Deaths: <span id="deaths">0</span>
    💰 Profit: <span id="profit">0</span>
  </div>

  <script>
    // 👉 leemos el parámetro ?session= de la URL
    const params = new URLSearchParams(window.location.search);
    const session = params.get("session") || "default";

    async function updateStats() {
      try {
        const res = await fetch(`/stats?session=${session}`);
        const data = await res.json();

        document.getElementById("kills").innerText = data.kills;
        document.getElementById("deaths").innerText = data.deaths;
        document.getElementById("profit").innerText =
          Math.floor(data.profit / 1000) + "k";
      } catch (e) {
        console.error("Error obteniendo stats");
      }
    }

    updateStats();
    setInterval(updateStats, 30000); // cada 30 segundos
  </script>
</body>
</html>
